name: Publish to BadgeHub

# Builds the .mpk and publishes it to BadgeHub on a version tag (e.g. v1.0.3),
# or on manual dispatch. One-time setup:
#   1. Create the project on badgehub.eu with slug com.linuxbe.thefreelanternplayer
#      and select the "mpos_api_0" badge.
#   2. Generate a project API token on BadgeHub and store it as the repo secret
#      BADGEHUB_TOKEN (Settings > Secrets and variables > Actions).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  SLUG: com.linuxbe.thefreelanternplayer
  BASE: https://badgehub.eu/api/v3

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version from MANIFEST.JSON
        id: meta
        run: |
          version=$(python3 -c "import json;print(json.load(open('$SLUG/MANIFEST.JSON'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag v$tag does not match MANIFEST.JSON version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Build .mpk
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          ./build.sh

      - name: Upload .mpk to BadgeHub draft
        env:
          BADGEHUB_TOKEN: ${{ secrets.BADGEHUB_TOKEN }}
        run: |
          if [ -z "$BADGEHUB_TOKEN" ]; then
            echo "BADGEHUB_TOKEN secret is not set." >&2
            exit 1
          fi
          mpk="${SLUG}_${{ steps.meta.outputs.version }}.mpk"
          echo "Uploading dist/$mpk to draft of $SLUG"
          curl --fail-with-body -sS -X POST \
            -H "badgehub-api-token: $BADGEHUB_TOKEN" \
            -F "file=@dist/$mpk" \
            "$BASE/projects/$SLUG/draft/files/$mpk"

      - name: Sync store version and prune old builds
        env:
          BADGEHUB_TOKEN: ${{ secrets.BADGEHUB_TOKEN }}
        run: |
          ver="${{ steps.meta.outputs.version }}"
          mpk="${SLUG}_${ver}.mpk"
          H="badgehub-api-token: $BADGEHUB_TOKEN"
          # Sync BadgeHub's store version to the app version (read-modify-write
          # preserves the name/description/badges set in the BadgeHub UI).
          curl --fail-with-body -sS -H "$H" "$BASE/projects/$SLUG/draft/files/metadata.json" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);d['version']='$ver';open('md.json','w').write(json.dumps(d))"
          curl --fail-with-body -sS -X POST -H "$H" -F "file=@md.json" \
            "$BASE/projects/$SLUG/draft/files/metadata.json"
          # Prune any .mpk from a previous release so only the current one ships.
          curl --fail-with-body -sS -H "$H" "$BASE/projects/$SLUG/draft" \
            | python3 -c "import json,sys;v=json.load(sys.stdin).get('version') or {};[print((((x.get('dir') or '')+'/') if x.get('dir') else '')+x['name']+x['ext']) for x in (v.get('files') or []) if x.get('ext')=='.mpk']" \
            | { grep -vx "$mpk" || true; } \
            | while read -r old; do
                echo "pruning old build: $old"
                curl --fail-with-body -sS -X DELETE -H "$H" "$BASE/projects/$SLUG/draft/files/$old"
              done

      - name: Upload and set the store icon
        env:
          BADGEHUB_TOKEN: ${{ secrets.BADGEHUB_TOKEN }}
        run: |
          # Upload the 64x64 icon, then have BadgeHub generate the store icon
          # sizes from it (this is what appears as the app thumbnail).
          curl --fail-with-body -sS -X POST \
            -H "badgehub-api-token: $BADGEHUB_TOKEN" \
            -F "file=@$SLUG/icon_64x64.png" \
            "$BASE/projects/$SLUG/draft/files/icon_64x64.png"
          curl --fail-with-body -sS -X POST \
            -H "badgehub-api-token: $BADGEHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"filePath":"icon_64x64.png","sizes":["64x64"]}' \
            "$BASE/projects/$SLUG/draft/icon"

      - name: Publish the draft as a new version
        env:
          BADGEHUB_TOKEN: ${{ secrets.BADGEHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X PATCH \
            -H "badgehub-api-token: $BADGEHUB_TOKEN" \
            "$BASE/projects/$SLUG/publish"
          echo "Published $SLUG ${{ steps.meta.outputs.version }} to BadgeHub."
